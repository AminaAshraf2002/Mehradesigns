<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
    <defs>
      <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FAF6F0"/>
        <stop offset="50%" stop-color="#EFE6D5"/>
        <stop offset="100%" stop-color="#DECFAF"/>
      </linearGradient>
      <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#F4D068"/>
        <stop offset="50%" stop-color="#B99465"/>
        <stop offset="100%" stop-color="#7A5C34"/>
      </linearGradient>
      <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
        <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#221D16" flood-opacity="0.3"/>
      </filter>
    </defs>
    <rect width="500" height="500" fill="url(#bgGrad)"/>
    
    <!-- Beige Marble Display Block -->
    <rect x="110" y="240" width="280" height="180" rx="12" fill="#E6D9C3" stroke="#D4C5AC" stroke-width="2" filter="url(#shadow)"/>

    <!-- Black Designer Sunglasses & Gold Jewelry Composition -->
    <g filter="url(#shadow)">
      <!-- Sunglass Left Lens -->
      <rect x="160" y="210" width="75" height="48" rx="14" fill="#1C1814" stroke="url(#gold)" stroke-width="3"/>
      <!-- Sunglass Right Lens -->
      <rect x="265" y="210" width="75" height="48" rx="14" fill="#1C1814" stroke="url(#gold)" stroke-width="3"/>
      <!-- Bridge -->
      <path d="M235 224 C245 218 255 218 265 224" fill="none" stroke="url(#gold)" stroke-width="4"/>
      <!-- Temple Arms -->
      <path d="M160 220 L135 212 M340 220 L365 212" fill="none" stroke="url(#gold)" stroke-width="3.5"/>

      <!-- Gold Statement Ring -->
      <circle cx="210" cy="310" r="22" fill="none" stroke="url(#gold)" stroke-width="6"/>
      <polygon points="210,280 220,290 200,290" fill="url(#gold)"/>

      <!-- Gold Chain -->
      <path d="M260 300 Q290 340 320 300" fill="none" stroke="url(#gold)" stroke-width="4" stroke-dasharray="6,4"/>
    </g>
  </svg>